repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks: [{id: black}]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks: [{id: ruff}]
  # Run mypy through the project environment rather than pre-commit's isolated
  # venv, which cannot see project dependencies (fastapi, pydantic, lightgbm,
  # types-requests) and so reports spurious errors under strict mode. This keeps
  # the hook, `just type`, and CI running the exact same command.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project env)
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
